# ============================================================
# MarkFlow 生产部署（Ubuntu 服务器一键启动）
#
#   cd MarkFlow/docker
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up -d
#
# 架构：markflow（应用）+ postgres（存储），数据落在 pgdata 卷。
# ============================================================

services:
  markflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: markflow:latest
    container_name: markflow
    restart: unless-stopped
    ports:
      # 双栈发布：启用 IPv6 的内核上同时监听 0.0.0.0 与 [::]；
      # 若 Docker 未启用 IPv6，用 docker-compose.host-net.yml。
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?请在环境变量中设置 JWT_SECRET}
      AUTH_USERS: ${AUTH_USERS:-admin:admin123}
      DATABASE_URL: postgres://markflow:${PG_PASSWORD:-markflow}@postgres:5432/markflow
    volumes:
      # Typora 主题目录（CSS 静态资源）
      - ${THEMES_DIR:-/data/themes}:/data/themes
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: markflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: markflow
      POSTGRES_PASSWORD: ${PG_PASSWORD:-markflow}
      POSTGRES_DB: markflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
