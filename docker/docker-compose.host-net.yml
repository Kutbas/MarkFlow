# host 网络模式（IPv6 透传最彻底）
#   docker compose -f docker-compose.host-net.yml up -d

services:
  markflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: markflow:latest
    container_name: markflow
    restart: unless-stopped
    network_mode: host
    environment:
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      AUTH_USERS: ${AUTH_USERS:-admin:admin123}
      # host 模式下 postgres 也需在宿主机或指定地址
      DATABASE_URL: ${DATABASE_URL:?请设置 DATABASE_URL}
    volumes:
      - ${THEMES_DIR:-/data/themes}:/data/themes

  postgres:
    image: postgres:17-alpine
    container_name: markflow-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: markflow
      POSTGRES_PASSWORD: ${PG_PASSWORD:-markflow}
      POSTGRES_DB: markflow
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
