packages:
  - server
  - web

# pnpm 10+ 默认拦截依赖的 postinstall 脚本，pnpm 12 的放行键为 allowBuilds：
# - esbuild: vite 的二进制安装脚本
# - puppeteer: 下载 Chromium 无头浏览器
allowBuilds:
  esbuild: true
  puppeteer: true

# pnpm 12 供应链保护（minimumReleaseAge）需要放行的近期发布版本
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.1.2'
  - vite@8.3.3
